<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="800" height="1100" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Lumen 3-shelf bookcase, page 1: Introduction and safety"><title>Lumen 3-shelf bookcase - page 1</title><rect width="800" height="1100" fill="#fff"/><text x="40" y="56" font-size="24" font-weight="700" fill="#1a1a1a">LUMEN 3-shelf bookcase</text><text x="40" y="82" font-size="15" font-weight="400" fill="#555">Introduction and safety</text><line x1="40" y1="96" x2="760" y2="96" stroke="#333" stroke-width="1.5"/><text x="40" y="150" font-size="20" font-weight="700" fill="#1a1a1a">Assembly instructions</text><text x="40" y="180" font-size="15" font-weight="400" fill="#1a1a1a">Read all instructions before you begin. Keep this leaflet for future use.</text><rect x="560" y="130" width="190" height="230" rx="3" fill="#fff" stroke="#333" stroke-width="1.5"/><line x1="560" y1="205" x2="750" y2="205" stroke="#333" stroke-width="1.5"/><line x1="560" y1="282" x2="750" y2="282" stroke="#333" stroke-width="1.5"/><text x="40" y="230" font-size="16" font-weight="400" fill="#1a1a1a">Assembly time: about 45 minutes</text><text x="40" y="256" font-size="16" font-weight="400" fill="#1a1a1a">People needed: 2</text><text x="40" y="330" font-size="20" font-weight="700" fill="#1a1a1a">Safety</text><rect x="40" y="346" width="720" height="30" rx="4" fill="#fde8e6" stroke="#b3261e" stroke-width="1.5"/><text x="50" y="366" font-size="13" font-weight="700" fill="#1a1a1a">WARNING: Two adults are needed to stand the bookcase upright.</text><rect x="40" y="386" width="720" height="30" rx="4" fill="#fde8e6" stroke="#b3261e" stroke-width="1.5"/><text x="50" y="406" font-size="13" font-weight="700" fill="#1a1a1a">WARNING: Attach the wall strap. An unsecured bookcase can tip over and cause serious injury.</text><rect x="40" y="426" width="720" height="30" rx="4" fill="#fff4d6" stroke="#a86b00" stroke-width="1.5"/><text x="50" y="446" font-size="13" font-weight="700" fill="#1a1a1a">CAUTION: Work on the carton or a soft cloth to protect the panels.</text><rect x="40" y="466" width="720" height="30" rx="4" fill="#fff4d6" stroke="#a86b00" stroke-width="1.5"/><text x="50" y="486" font-size="13" font-weight="700" fill="#1a1a1a">CAUTION: Do not climb on or hang from the bookcase.</text><text x="40" y="540" font-size="20" font-weight="700" fill="#1a1a1a">Tools</text><text x="40" y="570" font-size="15" font-weight="400" fill="#1a1a1a">Tools needed (not included): Phillips screwdriver, hammer.</text><text x="40" y="596" font-size="15" font-weight="400" fill="#1a1a1a">Included in the carton: hex key.</text><circle cx="120" cy="760" r="56" fill="#fff" stroke="#b3261e" stroke-width="4"/><line x1="80" y1="800" x2="160" y2="720" stroke="#b3261e" stroke-width="4"/><circle cx="120" cy="740" r="8" fill="#fff" stroke="#333" stroke-width="1.5"/><line x1="120" y1="748" x2="120" y2="780" stroke="#333" stroke-width="1.5"/><line x1="120" y1="760" x2="100" y2="774" stroke="#333" stroke-width="1.5"/><line x1="120" y1="760" x2="140" y2="774" stroke="#333" stroke-width="1.5"/><text x="200" y="750" font-size="14" font-weight="400" fill="#555">Pictogram: tipping hazard</text><text x="200" y="772" font-size="13" font-weight="400" fill="#555">(no text printed with this symbol)</text><text x="40" y="900" font-size="14" font-weight="400" fill="#555">Contents: 1 Parts   2 Assembly steps 1-10   3 Wall fixing and use</text><line x1="40" y1="1050" x2="760" y2="1050" stroke="#333" stroke-width="1.5"/><text x="760" y="1074" font-size="13" font-weight="400" fill="#555" text-anchor="end">Page 1</text><text x="40" y="1074" font-size="13" font-weight="400" fill="#555">Model LB-3  -  Original sample content for testing</text></svg>
