<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="800" height="1100" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Lumen 3-shelf bookcase, page 4: Assembly: steps 3 and 4"><title>Lumen 3-shelf bookcase - page 4</title><rect width="800" height="1100" fill="#fff"/><text x="40" y="56" font-size="24" font-weight="700" fill="#1a1a1a">LUMEN 3-shelf bookcase</text><text x="40" y="82" font-size="15" font-weight="400" fill="#555">Assembly: steps 3 and 4</text><line x1="40" y1="96" x2="760" y2="96" stroke="#333" stroke-width="1.5"/><rect x="40" y="154" width="720" height="418" rx="8" fill="#fff" stroke="#888" stroke-width="1.5" stroke-dasharray="6 4"/><circle cx="68" cy="186" r="13" fill="#1a1a1a" stroke="#333" stroke-width="1.5"/><text x="68" y="191" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="94" y="192" font-size="15" font-weight="700" fill="#1a1a1a">Press a cam lock F into each round hole on the shelf ends.</text><rect x="184" y="383.9" width="400" height="70" rx="3" fill="#f3ede2" stroke="#333" stroke-width="1.5"/><circle cx="384" cy="423.9" r="11" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="384" y="428.9" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">C</text><circle cx="234" cy="418.9" r="22" fill="#fff" stroke="#333" stroke-width="1.5"/><line x1="222" y1="424.9" x2="246" y2="412.9" stroke="#b3261e" stroke-width="2"/><polygon points="246,412.9 237.001,413.023 240.502,420.026" fill="#b3261e"/><circle cx="534" cy="418.9" r="22" fill="#fff" stroke="#333" stroke-width="1.5"/><line x1="522" y1="424.9" x2="546" y2="412.9" stroke="#b3261e" stroke-width="2"/><polygon points="546,412.9 537.001,413.023 540.502,420.026" fill="#b3261e"/><circle cx="634" cy="418.9" r="11" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="634" y="423.9" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">F</text><rect x="60" y="234" width="560" height="30" rx="4" fill="#fff4d6" stroke="#a86b00" stroke-width="1.5"/><text x="70" y="254" font-size="13" font-weight="700" fill="#1a1a1a">CAUTION: Work on the carton or a soft cloth to protect the panels.</text><rect x="40" y="594" width="720" height="418" rx="8" fill="#fff" stroke="#888" stroke-width="1.5" stroke-dasharray="6 4"/><circle cx="68" cy="626" r="13" fill="#1a1a1a" stroke="#333" stroke-width="1.5"/><text x="68" y="631" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="94" y="632" font-size="15" font-weight="700" fill="#1a1a1a">Slot the shelves onto the cam bolts and turn each cam lock clockwise until it stops.</text><rect x="112" y="698.5" width="60" height="280" rx="3" fill="#f3ede2" stroke="#333" stroke-width="1.5"/><circle cx="142" cy="838.5" r="11" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="142" y="843.5" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">A</text><rect x="182" y="768.5" width="300" height="36" rx="3" fill="#e9dfce" stroke="#333" stroke-width="1.5"/><circle cx="332" cy="786.5" r="11" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="332" y="791.5" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">C</text><line x1="552" y1="786.5" x2="492" y2="786.5" stroke="#b3261e" stroke-width="2"/><polygon points="492,786.5 500.104,790.415 500.104,782.585" fill="#b3261e"/><rect x="182" y="888.5" width="300" height="36" rx="3" fill="#e9dfce" stroke="#333" stroke-width="1.5"/><circle cx="332" cy="906.5" r="11" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="332" y="911.5" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">C</text><line x1="552" y1="906.5" x2="492" y2="906.5" stroke="#b3261e" stroke-width="2"/><polygon points="492,906.5 500.104,910.415 500.104,902.585" fill="#b3261e"/><line x1="40" y1="1050" x2="760" y2="1050" stroke="#333" stroke-width="1.5"/><text x="760" y="1074" font-size="13" font-weight="400" fill="#555" text-anchor="end">Page 4</text><tex