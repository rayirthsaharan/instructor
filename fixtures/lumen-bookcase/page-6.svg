<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="800" height="1100" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Lumen 3-shelf bookcase, page 6: Assembly: steps 7 and 8, wall fixing and use"><title>Lumen 3-shelf bookcase - page 6</title><rect width="800" height="1100" fill="#fff"/><text x="40" y="56" font-size="24" font-weight="700" fill="#1a1a1a">LUMEN 3-shelf bookcase</text><text x="40" y="82" font-size="15" font-weight="400" fill="#555">Assembly: steps 7 and 8, wall fixing and use</text><line x1="40" y1="96" x2="760" y2="96" stroke="#333" stroke-width="1.5"/><rect x="40" y="154" width="720" height="418" rx="8" fill="#fff" stroke="#888" stroke-width="1.5" stroke-dasharray="6 4"/><circle cx="68" cy="186" r="13" fill="#1a1a1a" stroke="#333" stroke-width="1.5"/><text x="68" y="191" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">7</text><text x="94" y="192" font-size="15" font-weight="700" fill="#1a1a1a">Tip the bookcase upright together and slide it into place.</text><rect x="148" y="299.4" width="160" height="230" rx="3" fill="#f3ede2" stroke="#333" stroke-width="1.5"/><line x1="348" y1="409.4" x2="398" y2="319.4" stroke="#b3261e" stroke-width="2"/><polygon points="398,319.4 390.642,324.583 397.486,328.385" fill="#b3261e"/><circle cx="478" cy="339.4" r="16" fill="#fff" stroke="#333" stroke-width="1.5"/><line x1="478" y1="355.4" x2="478" y2="429.4" stroke="#333" stroke-width="1.5"/><line x1="478" y1="379.4" x2="438" y2="359.4" stroke="#333" stroke-width="1.5"/><line x1="478" y1="429.4" x2="464" y2="489.4" stroke="#333" stroke-width="1.5"/><line x1="478" y1="429.4" x2="492" y2="489.4" stroke="#333" stroke-width="1.5"/><circle cx="568" cy="339.4" r="16" fill="#fff" stroke="#333" stroke-width="1.5"/><line x1="568" y1="355.4" x2="568" y2="429.4" stroke="#333" stroke-width="1.5"/><line x1="568" y1="379.4" x2="528" y2="359.4" stroke="#333" stroke-width="1.5"/><line x1="568" y1="429.4" x2="554" y2="489.4" stroke="#333" stroke-width="1.5"/><line x1="568" y1="429.4" x2="582" y2="489.4" stroke="#333" stroke-width="1.5"/><rect x="60" y="526" width="680" height="30" rx="4" fill="#fde8e6" stroke="#b3261e" stroke-width="1.5"/><text x="70" y="546" font-size="13" font-weight="700" fill="#1a1a1a">WARNING: Two adults are needed to stand the bookcase upright.</text><rect x="40" y="594" width="720" height="418" rx="8" fill="#fff" stroke="#888" stroke-width="1.5" stroke-dasharray="6 4"/><circle cx="68" cy="626" r="13" fill="#1a1a1a" stroke="#333" stroke-width="1.5"/><text x="68" y="631" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">8</text><text x="94" y="632" font-size="15" font-weight="700" fill="#1a1a1a">Fix the strap to the back of the top panel and to a wall stud or wall anchor.</text><rect x="392" y="667.6" width="14" height="250" rx="3" fill="#cfd8dc" stroke="#333" stroke-width="1.5"/><rect x="112" y="707.6" width="150" height="200" rx="3" fill="#f3ede2" stroke="#333" stroke-width="1.5"/><line x1="262" y1="717.6" x2="392" y2="717.6" stroke="#2a5d8f" stroke-width="3"/><circle cx="262" cy="717.6" r="5" fill="#fff" stroke="#333" stroke-width="1.5"/><circle cx="392" cy="717.6" r="5" fill="#fff" stroke="#333" stroke-width="1.5"/><circle cx="327" cy="697.6" r="11" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="327" y="702.6" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">I</text><rect x="60" y="924" width="680" height="30" rx="4" fill="#fde8e6" stroke="#b3261e" stroke-width="1.5"/><text x="70" y="944" font-size="13" font-weight="700" fill="#1a1a1a">WARNING: Attach the wall strap. An unsecured bookcase can tip over and cause serious injury.</text><text x="60" y="994" font-size="14" font-weight="700" fill="#1a1a1a">Maximum load per shelf: 15 kg.</text><text x="340" y="994" font-size="13" font-weight="700" fill="#1a1a1a">CAUTION: Do not climb on or hang from the bookcase.</text><text x="360" y="699" font-size="13" font-weight="400" fill="#555">Wall</text><line x1="40" y1="1050" x2="760" y2="1050" stroke="#333" stroke-width="1.5"/><text x="760" y="1074" font-size="13" font-weight="400" fill="#555" text-anchor="end">Page 6</text><text x="40" y="1074" font-size="13" font-weight="400" fill="#555">Model LB-3  -  Original sample content for testing</text></svg>
